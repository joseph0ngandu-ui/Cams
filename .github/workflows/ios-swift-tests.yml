name: iOS Swift Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  swift-and-ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: CamsApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Swift protocol and packetisation tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project Cams.xcodeproj \
            -scheme Cams \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            build CODE_SIGNING_ALLOWED=NO
